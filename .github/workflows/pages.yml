name: Deploy prototypes to GitHub Pages

# The prototypes are plain static HTML/CSS/JS — no build step. This workflow
# just assembles the publishable files and hands them to Pages so the team can
# open a shared link instead of cloning the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        # Only the files the browser needs — keeps repo notes, brand-guideline
        # source decks and .claude config out of the published site.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r brand _site/
          cp -r prototypes _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
