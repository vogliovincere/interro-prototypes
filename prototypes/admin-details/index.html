<!DOCTYPE html>
<html lang="en" data-theme="interro-green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interro · Settlement Account Details</title>
  <link rel="stylesheet" href="../../brand/tokens.css" />
  <link rel="stylesheet" href="../shared/picker.css" />
  <!-- Two sheets are loaded as base layers before this prototype's own delta.
       Neither is modified — the capital-call and distribution prototypes are
       left exactly as they were.

         capital-call/app.css  the shell: phone frame, dev console, buttons,
                               cards, rows, modal, toast.
         distributions/app.css the form and terminal layers: .intro__lede,
                               .steps, .gotcha, .reqchip, .errsum, .terminal,
                               .summary, .spinner.

       Stacking them beats a third copy of a thousand lines that would drift
       within a week. The cost is some inert CSS (.distcard, .checkitem) that
       this flow never uses, which is cheaper than the drift. If a fourth
       prototype appears, the shared layers should be lifted into
       prototypes/shared/ — but that is a change to the existing two, and this
       round was asked to leave them alone. -->
  <link rel="stylesheet" href="../capital-call-wire-details/app.css" />
  <link rel="stylesheet" href="../distributions/app.css" />
  <!-- ?v= is a cache buster, and it is not decoration. GitHub Pages serves these
       files with Cache-Control: max-age=600, so for ten minutes after a deploy a
       browser that already has the page reuses the OLD app.js and app.css without
       even asking - which looks exactly like a fix that did not work. Changing the
       query string changes the URL, so the new file is fetched immediately.

       BUMP THIS on any change to app.css, adf.js or app.js. It is the difference
       between "fixed" and "fixed, and the person you sent the link to can see it".
       Only this prototype's own assets carry it; the two shared sheets above
       belong to the other prototypes and are left exactly as they are. -->
  <link rel="stylesheet" href="app.css?v=7" />
</head>
<body>

<div class="stage">

  <!-- ======================================================================
       DEV TOOLS — demo scaffolding, lives OUTSIDE the mobile frame.
       Never ships; exists so the flow and its variants can be driven live.
       Hidden unless the URL carries ?dev=1 — see the .devmode rule in app.css.
       ==================================================================== -->
  <aside class="dev">
    <div class="dev__title">Dev tools</div>

    <section class="dev__group">
      <p class="dev__label">Flow</p>
      <div class="dev__nav">
        <button class="dev__navitem" data-goto="intro">1 · What this is</button>
        <button class="dev__navitem" data-goto="accounts">2 · Accounts</button>
        <button class="dev__navitem" data-goto="review">3 · Review</button>
        <button class="dev__navitem" data-goto="done">4 · Submitted</button>
      </div>
    </section>

    <!-- The demo that sells the whole thing: a worked CLO, shaped exactly like
         the completed admin-details form Quorim supplied. The STRUCTURE is real;
         the names and numbers are invented, because this repo is mirrored to a
         public site and the source document holds a live CLO's live wire
         coordinates. See the note above seedCloExample() in app.js. -->
    <section class="dev__group">
      <p class="dev__label">Seed data</p>
      <button class="dev__reset" id="dev-seed">Load the worked CLO example</button>
      <p class="dev__hint">
        Two tagged sub-accounts inside one trustee DDA — collection and custody —
        which is the shape a flat one-account form cannot hold.
      </p>
    </section>

    <!-- The feature this prototype exists to evaluate. Off = one flat account
         with no tag and no second level, i.e. what a naive form would ship. -->
    <section class="dev__group">
      <p class="dev__label">Two-level accounts &amp; tagging</p>
      <label class="dev__check">
        <input type="checkbox" id="dev-twolevel" checked />
        <span>Ask DDA vs FFC structure &amp; tag each account</span>
      </label>
      <div class="dev__sub" id="dev-twolevel-sub">
        <label class="dev__check">
          <input type="checkbox" id="dev-ffcbuild" checked />
          <span>Offer to build the FFC account name</span>
        </label>
      </div>
    </section>

    <section class="dev__group">
      <p class="dev__label">Account being edited</p>
      <p class="dev__label" style="margin-top:8px">Bank country</p>
      <select class="dev__select" id="dev-country"></select>
      <p class="dev__hint" id="dev-schema-note"></p>
      <div class="dev__seg dev__seg--col" data-seg="structure">
        <button data-structure="dedicated">Dedicated account (1 level)</button>
        <button data-structure="omnibus">Custodian sub-account (2 levels)</button>
      </div>
    </section>

    <section class="dev__group">
      <p class="dev__label">Form behaviour</p>
      <label class="dev__check">
        <input type="checkbox" id="dev-uslabels" checked />
        <span>Show U.S. equivalent under each field</span>
      </label>
      <label class="dev__check">
        <input type="checkbox" id="dev-hints" checked />
        <span>Show “where to find it” hints</span>
      </label>
      <label class="dev__check">
        <input type="checkbox" id="dev-prefill" />
        <span>Prefill with valid sample data</span>
      </label>
    </section>

    <!-- ADFlow's stated benefit is "Remove Call-Backs", replaced by maker/checker
         + version history. Both endings are togglable because which one Interro
         ships is a policy decision, not a design one. -->
    <section class="dev__group">
      <p class="dev__label">Submitted screen</p>
      <div class="dev__seg dev__seg--col" data-seg="done">
        <button data-done="checker">Awaiting maker/checker approval</button>
        <button data-done="callback">Awaiting phone callback</button>
        <button data-done="published">Published</button>
      </div>
    </section>

    <section class="dev__group dev__group--last">
      <button class="dev__reset" id="dev-reset">Reset demo</button>
    </section>
  </aside>

  <!-- ======================================================================
       EMBEDDED FRAME — wide by default (see the width note in app.css), falling
       back to the same 390px mobile geometry as the other two flows below 900px.
       ==================================================================== -->
  <div class="phone">
    <div class="phone__scroll" id="scroll">

      <header class="wtop">
        <img class="wtop__logo" src="../../brand/interro-logo.png" alt="interro" />
        <span class="wtop__ctx">Account Details</span>
      </header>

      <div class="progress" id="progress" role="progressbar"
           aria-valuemin="1" aria-valuemax="4" aria-label="Progress"></div>

      <main id="app" class="screen"><!-- rendered by app.js --></main>

      <footer class="powered">
        <span>Powered by</span>
        <img src="../../brand/interro-logo.png" alt="Interro" />
      </footer>
    </div>

    <div class="modalroot" id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

</div>

<script src="../shared/countries.js"></script>
<script src="../shared/wireReceive.js"></script>
<script src="../shared/picker.js"></script>
<!-- ?v= must match the stylesheet above — see the note in <head>. -->
<script src="adf.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
